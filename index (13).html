<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"/>
  <title>The Spiral Project</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }
    #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; font-family: monospace; }
    #title { position: absolute; top: 24px; width: 100%; text-align: center; color: #00bfff; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.8; }
    #status { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); border: 1px solid #00bfff44; color: #00bfff; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 24px; border-radius: 2px; white-space: nowrap; }
    #corner-tl, #corner-tr, #corner-bl, #corner-br { position: absolute; width: 24px; height: 24px; border-color: #00bfff44; border-style: solid; }
    #corner-tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    #corner-tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    #corner-bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
    #corner-br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }
  </style>
</head>
<body>
<div id="ui">
  <div id="title">✦ The Spiral Project ✦</div>
  <div id="corner-tl"></div><div id="corner-tr"></div>
  <div id="corner-bl"></div><div id="corner-br"></div>
  <div id="status">Loading...</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane
      width="1" height="1"
      position="0 0 0.001"
      material="transparent: true; opacity: 1; side: double; alphaTest: 0.01"
      spiral-animation>
    </a-plane>
  </a-entity>
</a-scene>

<script>
const FW_COLORS = ['#00dfff','#00dfff','#ff9fc7','#ff9fc7','#ffffff','#ffffff','#00aaff','#ffafc7'];

AFRAME.registerComponent('spiral-animation', {
  init: function () {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const W = 512, H = 512, CX = 256, CY = 256;
    const MAX_T = 5 * Math.PI * 2;
    const SPIRAL_DURATION = 10000;
    const FIREWORK_DURATION = 16000;

    // Auto-scale — spiral always fits canvas with margin
    const maxR = Math.exp(0.15 * MAX_T);
    const SCALE = (Math.min(CX, CY) - 20) / maxR;

    let phase = 'waiting', startTime = null, fireworks = [];

    function makeParticle(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 9 + 3;
      return {
        x, y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1.0, decay: Math.random() * 0.009 + 0.004,
        radius: Math.random() * 4 + 2,
        color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
        trail: []
      };
    }

    function launchFirework() {
      const t = Math.random() * MAX_T;
      const r = SCALE * Math.exp(0.15 * t);
      const x = CX + Math.cos(t) * r;
      const y = CY + Math.sin(t) * r;
      for (let i = 0; i < Math.floor(Math.random() * 40) + 25; i++) fireworks.push(makeParticle(x, y));
    }

    function drawSpiral(tMax, alpha) {
      ctx.save();
      ctx.strokeStyle = '#00dfff';
      ctx.lineWidth = 3.5;
      ctx.globalAlpha = alpha;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#00bfff';
      ctx.beginPath();
      let first = true;
      for (let i = 0; i <= 1000; i++) {
        const t = (i / 1000) * tMax;
        const r = SCALE * Math.exp(0.15 * t);
        const x = CX + Math.cos(t) * r;
        const y = CY + Math.sin(t) * r;
        if (first) { ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    const texture = new THREE.CanvasTexture(canvas);
    this.el.getObject3D('mesh').material.map = texture;
    this.el.getObject3D('mesh').material.transparent = true;
    this.el.getObject3D('mesh').material.needsUpdate = true;

    const statusEl = document.getElementById('status');
    let running = false;

    this.el.sceneEl.addEventListener('loaded', () => { statusEl.textContent = 'Point camera at target'; });

    const target = document.querySelector('[mindar-image-target]');
    target.addEventListener('targetFound', () => {
      phase = 'spiral'; startTime = null; fireworks = []; running = true;
      statusEl.textContent = 'Building spiral...';
    });
    target.addEventListener('targetLost', () => {
      running = false;
      ctx.clearRect(0, 0, W, H);
      texture.needsUpdate = true;
      statusEl.textContent = 'Point camera at target';
    });

    this.tick = function(time) {
      if (!running) return;
      if (!startTime) startTime = time;
      const elapsed = time - startTime;

      ctx.clearRect(0, 0, W, H);

      if (phase === 'spiral') {
        const progress = Math.min(elapsed / SPIRAL_DURATION, 1);
        const tMax = progress * MAX_T;

        drawSpiral(tMax, 1.0);

        // Glowing orb at tip
        const tipR = SCALE * Math.exp(0.15 * tMax);
        const tipX = CX + Math.cos(tMax) * tipR;
        const tipY = CY + Math.sin(tMax) * tipR;
        ctx.save();
        const grad = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.3, 'rgba(0,223,255,0.8)');
        grad.addColorStop(1, 'rgba(0,191,255,0)');
        ctx.beginPath(); ctx.arc(tipX, tipY, 16, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();
        ctx.beginPath(); ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 1; ctx.fill();
        ctx.restore();

        const secs = Math.ceil((SPIRAL_DURATION - elapsed) / 1000);
        if (secs > 0) statusEl.textContent = `Building... ${secs}s`;

        if (progress >= 1) { phase = 'fireworks'; startTime = time; statusEl.textContent = '✦ Igniting...'; }

      } else if (phase === 'fireworks') {
        const fw_elapsed = time - startTime;

        drawSpiral(MAX_T, 0.3);

        if (fw_elapsed < FIREWORK_DURATION && Math.random() < 0.15) launchFirework();

        for (let i = fireworks.length - 1; i >= 0; i--) {
          const p = fireworks[i];
          p.trail.push({x: p.x, y: p.y});
          if (p.trail.length > 10) p.trail.shift();
          for (let j = 1; j < p.trail.length; j++) {
            ctx.save();
            ctx.globalAlpha = (j / p.trail.length) * p.life * 0.7;
            ctx.strokeStyle = p.color; ctx.lineWidth = p.radius * 0.9; ctx.lineCap = 'round';
            ctx.shadowBlur = 10; ctx.shadowColor = p.color;
            ctx.beginPath(); ctx.moveTo(p.trail[j-1].x, p.trail[j-1].y); ctx.lineTo(p.trail[j].x, p.trail[j].y);
            ctx.stroke(); ctx.restore();
          }
          ctx.save();
          ctx.shadowBlur = 16; ctx.shadowColor = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.globalAlpha = p.life * 0.8; ctx.fill();
          ctx.restore();

          p.x += p.vx; p.y += p.vy;
          p.vy += 0.07; p.vx *= 0.98; p.vy *= 0.98;
          p.life -= p.decay;
          if (p.life <= 0) fireworks.splice(i, 1);
        }

        if (fw_elapsed > 1000) statusEl.textContent = '✦ Fireworks!';
        if (fw_elapsed >= FIREWORK_DURATION && fireworks.length === 0) {
          phase = 'spiral'; startTime = time; fireworks = [];
          statusEl.textContent = 'Building spiral...';
        }
      }

      texture.needsUpdate = true;
    };
  }
});
</script>
</body>
</html>
