<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>The Spiral Project</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }

    #ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
      font-family: monospace;
    }

    #title {
      position: absolute;
      top: 24px;
      width: 100%;
      text-align: center;
      color: #00ffcc;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #status {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      border: 1px solid #00ffcc55;
      color: #00ffcc;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px 24px;
      border-radius: 2px;
      white-space: nowrap;
    }

    #corner-tl, #corner-tr, #corner-bl, #corner-br {
      position: absolute;
      width: 24px; height: 24px;
      border-color: #00ffcc55;
      border-style: solid;
    }
    #corner-tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    #corner-tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    #corner-bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
    #corner-br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }
  </style>
</head>
<body>

  <div id="ui">
    <div id="title">The Spiral Project</div>
    <div id="corner-tl"></div>
    <div id="corner-tr"></div>
    <div id="corner-bl"></div>
    <div id="corner-br"></div>
    <div id="status">Loading...</div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Outer glow ring -->
      <a-ring
        color="#00ffcc"
        radius-inner="0.37"
        radius-outer="0.40"
        opacity="0.4"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear"
      ></a-ring>

      <!-- Middle ring -->
      <a-ring
        color="#00aaff"
        radius-inner="0.22"
        radius-outer="0.25"
        opacity="0.5"
        animation="property: rotation; to: 0 0 -360; loop: true; dur: 5000; easing: linear"
        animation__pulse="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
      ></a-ring>

      <!-- Inner ring -->
      <a-ring
        color="#ffffff"
        radius-inner="0.08"
        radius-outer="0.10"
        opacity="0.3"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 3000; easing: linear"
      ></a-ring>

      <!-- Spiral arms as thin torus rings at angles -->
      <a-torus color="#00ffcc" radius="0.15" radius-tubular="0.005" opacity="0.7"
        rotation="45 0 0"
        animation="property: rotation; from: 45 0 0; to: 45 0 360; loop: true; dur: 4000; easing: linear">
      </a-torus>

      <a-torus color="#00ffcc" radius="0.25" radius-tubular="0.004" opacity="0.5"
        rotation="60 30 0"
        animation="property: rotation; from: 60 30 0; to: 60 30 360; loop: true; dur: 6000; easing: linear">
      </a-torus>

      <a-torus color="#00aaff" radius="0.32" radius-tubular="0.003" opacity="0.4"
        rotation="80 60 0"
        animation="property: rotation; from: 80 60 0; to: 80 60 360; loop: true; dur: 9000; easing: linear">
      </a-torus>

      <!-- Central glowing sphere -->
      <a-sphere
        color="#00ffcc"
        radius="0.04"
        opacity="0.9"
        animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 800; easing: easeInOutSine"
        animation__glow="property: components.material.opacity; from: 0.9; to: 0.3; dir: alternate; loop: true; dur: 800"
      ></a-sphere>

      <!-- Orbiting particles -->
      <a-sphere color="#00ffcc" radius="0.012" opacity="0.9" position="0.18 0 0.05"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 2000; easing: linear">
      </a-sphere>
      <a-sphere color="#ffffff" radius="0.008" opacity="0.7" position="-0.25 0.1 0"
        animation="property: rotation; to: 0 0 -360; loop: true; dur: 3000; easing: linear">
      </a-sphere>
      <a-sphere color="#00aaff" radius="0.010" opacity="0.8" position="0.1 -0.28 0"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 2500; easing: linear">
      </a-sphere>
      <a-sphere color="#00ffcc" radius="0.008" opacity="0.6" position="-0.15 0.2 0.05"
        animation="property: rotation; to: 0 0 -360; loop: true; dur: 3500; easing: linear">
      </a-sphere>

    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');

    // Wait for scene to load
    const scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', () => {
      status.textContent = 'Point camera at target';
    });

    // Target found/lost
    const target = document.querySelector('[mindar-image-target]');
    target.addEventListener('targetFound', () => {
      status.textContent = '✦ Spiral unlocked';
      status.style.borderColor = '#00ffcc88';
    });
    target.addEventListener('targetLost', () => {
      status.textContent = 'Point camera at target';
      status.style.borderColor = '#00ffcc55';
    });
  </script>

</body>
</html>
