<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>The Spiral Project</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: monospace; }

    #overlay-ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    #status-bar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      border: 1px solid #00ffcc55;
      color: #00ffcc;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px 24px;
      border-radius: 2px;
      white-space: nowrap;
      transition: opacity 0.5s;
    }

    #title {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ffcc;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.7;
      white-space: nowrap;
    }

    #corner-tl, #corner-tr, #corner-bl, #corner-br {
      position: absolute;
      width: 24px; height: 24px;
      border-color: #00ffcc66;
      border-style: solid;
    }
    #corner-tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    #corner-tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    #corner-bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
    #corner-br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }
  </style>
</head>
<body>

<div id="overlay-ui">
  <div id="title">The Spiral Project</div>
  <div id="corner-tl"></div>
  <div id="corner-tr"></div>
  <div id="corner-bl"></div>
  <div id="corner-br"></div>
  <div id="status-bar">Point camera at target</div>
</div>

<script>
const statusBar = document.getElementById('status-bar');

async function start() {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: './targets.mind',
    maxTrack: 1,
    uiScanning: false,
    uiLoading: false,
  });

  const { renderer, scene, camera } = mindarThree;

  // ---- Build the spiral overlay ----
  const anchor = mindarThree.addAnchor(0);
  const group = new THREE.Group();
  anchor.group.add(group);

  // Glowing Fibonacci spiral using line segments
  function makeSpiralLine(turns, color, opacity, scale) {
    const points = [];
    const totalSteps = turns * 200;
    for (let i = 0; i <= totalSteps; i++) {
      const t = (i / totalSteps) * turns * Math.PI * 2;
      const r = 0.002 * Math.exp(0.15 * t) * scale;
      points.push(new THREE.Vector3(
        Math.cos(t) * r,
        Math.sin(t) * r,
        0
      ));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: opacity,
    });
    return new THREE.Line(geometry, material);
  }

  // Multiple spiral layers for depth
  const spiral1 = makeSpiralLine(5, 0x00ffcc, 0.9, 1.0);
  const spiral2 = makeSpiralLine(5, 0x00aaff, 0.5, 0.85);
  const spiral3 = makeSpiralLine(5, 0xffffff, 0.3, 1.15);

  group.add(spiral1);
  group.add(spiral2);
  group.add(spiral3);

  // Floating particles (fireflies)
  const particleCount = 80;
  const particleGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const particleData = [];

  for (let i = 0; i < particleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 0.4 + 0.05;
    positions[i * 3]     = Math.cos(angle) * radius;
    positions[i * 3 + 1] = Math.sin(angle) * radius;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
    particleData.push({
      angle: angle,
      radius: radius,
      speed: (Math.random() - 0.5) * 0.008,
      zSpeed: (Math.random() - 0.5) * 0.003,
      z: positions[i * 3 + 2],
      phase: Math.random() * Math.PI * 2,
    });
  }

  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particleMat = new THREE.PointsMaterial({
    color: 0x00ffcc,
    size: 0.015,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true,
  });
  const particles = new THREE.Points(particleGeo, particleMat);
  group.add(particles);

  // Outer glow ring
  const ringGeo = new THREE.RingGeometry(0.38, 0.40, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x00ffcc,
    transparent: true,
    opacity: 0.3,
    side: THREE.DoubleSide,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  group.add(ring);

  // Inner pulse ring
  const pulseGeo = new THREE.RingGeometry(0.18, 0.20, 64);
  const pulseMat = new THREE.MeshBasicMaterial({
    color: 0x00aaff,
    transparent: true,
    opacity: 0.4,
    side: THREE.DoubleSide,
  });
  const pulseRing = new THREE.Mesh(pulseGeo, pulseMat);
  group.add(pulseRing);

  // ---- Tracking events ----
  let found = false;

  anchor.onTargetFound = () => {
    found = true;
    statusBar.textContent = '✦ Spiral unlocked';
    statusBar.style.color = '#00ffcc';
    statusBar.style.borderColor = '#00ffcc88';
  };

  anchor.onTargetLost = () => {
    found = false;
    statusBar.textContent = 'Point camera at target';
    statusBar.style.color = '#00ffcc';
    statusBar.style.borderColor = '#00ffcc55';
  };

  // ---- Animation loop ----
  let t = 0;
  renderer.setAnimationLoop(() => {
    t += 0.016;

    // Rotate spirals slowly
    spiral1.rotation.z += 0.004;
    spiral2.rotation.z -= 0.003;
    spiral3.rotation.z += 0.002;

    // Pulse rings
    const pulse = Math.sin(t * 2) * 0.5 + 0.5;
    pulseMat.opacity = 0.2 + pulse * 0.4;
    pulseRing.scale.set(1 + pulse * 0.08, 1 + pulse * 0.08, 1);
    ringMat.opacity = 0.15 + pulse * 0.2;

    // Animate particles
    const pos = particleGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      const d = particleData[i];
      d.angle += d.speed;
      d.z += d.zSpeed;
      if (Math.abs(d.z) > 0.2) d.zSpeed *= -1;
      pos[i * 3]     = Math.cos(d.angle) * d.radius;
      pos[i * 3 + 1] = Math.sin(d.angle) * d.radius;
      pos[i * 3 + 2] = d.z;
    }
    particleGeo.attributes.position.needsUpdate = true;

    // Flicker particles
    particleMat.opacity = 0.6 + Math.sin(t * 3 + 1) * 0.3;

    renderer.render(scene, camera);
  });

  // Start AR
  statusBar.textContent = 'Loading...';
  await mindarThree.start();
  statusBar.textContent = 'Point camera at target';
}

start().catch(err => {
  console.error(err);
  document.getElementById('status-bar').textContent = 'Error: ' + err.message;
});
</script>
</body>
</html>
