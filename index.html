<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>The Spiral Project</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: monospace; width: 100vw; height: 100vh; }
    #overlay-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    #status-bar { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); border: 1px solid #00ffcc55; color: #00ffcc; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 24px; border-radius: 2px; white-space: nowrap; }
    #title { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); color: #00ffcc; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.7; white-space: nowrap; }
    #corner-tl, #corner-tr, #corner-bl, #corner-br { position: absolute; width: 24px; height: 24px; border-color: #00ffcc66; border-style: solid; }
    #corner-tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    #corner-tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    #corner-bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
    #corner-br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }
  </style>
</head>
<body>
<div id="overlay-ui">
  <div id="title">The Spiral Project</div>
  <div id="corner-tl"></div><div id="corner-tr"></div>
  <div id="corner-bl"></div><div id="corner-br"></div>
  <div id="status-bar">Loading...</div>
</div>
<script>
const statusBar = document.getElementById('status-bar');
async function start() {
  try {
    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: document.body,
      imageTargetSrc: './targets.mind',
      maxTrack: 1,
      uiScanning: false,
      uiLoading: false,
    });
    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);
    const group = new THREE.Group();
    anchor.group.add(group);

    function makeSpiralLine(turns, color, opacity, scale) {
      const points = [];
      const totalSteps = turns * 200;
      for (let i = 0; i <= totalSteps; i++) {
        const t = (i / totalSteps) * turns * Math.PI * 2;
        const r = 0.002 * Math.exp(0.15 * t) * scale;
        points.push(new THREE.Vector3(Math.cos(t) * r, Math.sin(t) * r, 0));
      }
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      return new THREE.Line(geometry, material);
    }

    const s1 = makeSpiralLine(5, 0x00ffcc, 0.9, 1.0);
    const s2 = makeSpiralLine(5, 0x00aaff, 0.5, 0.85);
    group.add(s1); group.add(s2);
    group.add(makeSpiralLine(5, 0xffffff, 0.3, 1.15));

    const count = 80;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const pdata = [];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * 0.4 + 0.05;
      pos[i*3] = Math.cos(angle)*radius; pos[i*3+1] = Math.sin(angle)*radius; pos[i*3+2] = (Math.random()-0.5)*0.2;
      pdata.push({ angle, radius, speed: (Math.random()-0.5)*0.008, z: pos[i*3+2], zSpeed: (Math.random()-0.5)*0.003 });
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pmat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.015, transparent: true, opacity: 0.85 });
    group.add(new THREE.Points(geo, pmat));

    const pulseMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
    const pulseRing = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.20, 64), pulseMat);
    group.add(pulseRing);

    anchor.onTargetFound = () => { statusBar.textContent = '✦ Spiral unlocked'; };
    anchor.onTargetLost = () => { statusBar.textContent = 'Point camera at target'; };

    let t = 0;
    renderer.setAnimationLoop(() => {
      t += 0.016;
      s1.rotation.z += 0.004; s2.rotation.z -= 0.003;
      const pulse = Math.sin(t*2)*0.5+0.5;
      pulseMat.opacity = 0.2 + pulse*0.4;
      pulseRing.scale.set(1+pulse*0.08, 1+pulse*0.08, 1);
      const p = geo.attributes.position.array;
      for (let i = 0; i < count; i++) {
        const d = pdata[i]; d.angle += d.speed; d.z += d.zSpeed;
        if (Math.abs(d.z) > 0.2) d.zSpeed *= -1;
        p[i*3] = Math.cos(d.angle)*d.radius; p[i*3+1] = Math.sin(d.angle)*d.radius; p[i*3+2] = d.z;
      }
      geo.attributes.position.needsUpdate = true;
      pmat.opacity = 0.6 + Math.sin(t*3)*0.3;
      renderer.render(scene, camera);
    });

    await mindarThree.start();
    statusBar.textContent = 'Point camera at target';
  } catch(err) {
    statusBar.textContent = 'Error: ' + err.message;
    console.error(err);
  }
}
start();
</script>
</body>
</html>
