<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"/>
  <title>The Spiral Project</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }
    #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; font-family: monospace; }
    #title { position: absolute; top: 24px; width: 100%; text-align: center; color: #ff9900; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.8; }
    #status { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); border: 1px solid #ff660044; color: #ff9900; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 24px; border-radius: 2px; white-space: nowrap; }
    #corner-tl, #corner-tr, #corner-bl, #corner-br { position: absolute; width: 24px; height: 24px; border-color: #ff660044; border-style: solid; }
    #corner-tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    #corner-tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    #corner-bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
    #corner-br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }
  </style>
</head>
<body>

<div id="ui">
  <div id="title">✦ The Spiral Project ✦</div>
  <div id="corner-tl"></div><div id="corner-tr"></div>
  <div id="corner-bl"></div><div id="corner-br"></div>
  <div id="status">Loading...</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane
      width="1.2" height="1.2"
      position="0 0 0.001"
      material="transparent: true; opacity: 1; side: double; alphaTest: 0.01"
      spiral-animation>
    </a-plane>
  </a-entity>
</a-scene>

<script>
AFRAME.registerComponent('spiral-animation', {
  init: function () {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const CX = 256, CY = 256;
    const MAX_T = 5 * Math.PI * 2;
    const SPIRAL_DURATION = 12000;
    const FIREWORK_DURATION = 16000;

    let phase = 'waiting';
    let startTime = null;
    let fireworks = [];

    function makeParticle(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 7 + 2;
      const colors = ['#ff9900','#ff6600','#ffcc00','#ff3300','#ffaa00'];
      return {
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        decay: Math.random() * 0.012 + 0.006,
        radius: Math.random() * 3 + 1.5,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function launchFirework() {
      const t = Math.random() * MAX_T;
      const r = 2.2 * Math.exp(0.15 * t);
      const x = CX + Math.cos(t) * r;
      const y = CY + Math.sin(t) * r;
      for (let i = 0; i < Math.floor(Math.random() * 25) + 15; i++) {
        fireworks.push(makeParticle(x, y));
      }
    }

    function drawSpiral(tMax, alpha) {
      ctx.save();
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      let first = true;
      for (let i = 0; i <= 1000; i++) {
        const t = (i / 1000) * tMax;
        const r = 2.2 * Math.exp(0.15 * t);
        const x = CX + Math.cos(t) * r;
        const y = CY + Math.sin(t) * r;
        if (first) { ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    const texture = new THREE.CanvasTexture(canvas);
    this.el.getObject3D('mesh').material.map = texture;
    this.el.getObject3D('mesh').material.transparent = true;
    this.el.getObject3D('mesh').material.needsUpdate = true;

    const statusEl = document.getElementById('status');
    let running = false;

    this.el.sceneEl.addEventListener('loaded', () => {
      statusEl.textContent = 'Point camera at target';
    });

    const target = document.querySelector('[mindar-image-target]');

    target.addEventListener('targetFound', () => {
      phase = 'spiral';
      startTime = null;
      fireworks = [];
      running = true;
      statusEl.textContent = 'Building spiral...';
    });

    target.addEventListener('targetLost', () => {
      running = false;
      // Clear to fully transparent
      ctx.clearRect(0, 0, 512, 512);
      texture.needsUpdate = true;
      statusEl.textContent = 'Point camera at target';
    });

    this.tick = function(time) {
      if (!running) return;
      if (!startTime) startTime = time;
      const elapsed = time - startTime;

      // Always clear to transparent first
      ctx.clearRect(0, 0, 512, 512);

      if (phase === 'spiral') {
        const progress = Math.min(elapsed / SPIRAL_DURATION, 1);
        const tMax = progress * MAX_T;

        // Draw spiral
        drawSpiral(tMax, 0.85);

        // Small orb at tip
        const tipR = 2.2 * Math.exp(0.15 * tMax);
        const tipX = CX + Math.cos(tMax) * tipR;
        const tipY = CY + Math.sin(tMax) * tipR;
        ctx.save();
        ctx.beginPath();
        ctx.arc(tipX, tipY, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffcc00';
        ctx.globalAlpha = 0.9;
        ctx.fill();
        ctx.restore();

        const secs = Math.ceil((SPIRAL_DURATION - elapsed) / 1000);
        if (secs > 0) statusEl.textContent = `Building... ${secs}s`;

        if (progress >= 1) {
          phase = 'fireworks';
          startTime = time;
          statusEl.textContent = '✦ Igniting...';
        }

      } else if (phase === 'fireworks') {
        const fw_elapsed = time - startTime;

        // Faint spiral underneath
        drawSpiral(MAX_T, 0.3);

        // Launch fireworks
        if (fw_elapsed < FIREWORK_DURATION && Math.random() < 0.10) launchFirework();

        // Draw & update particles
        for (let i = fireworks.length - 1; i >= 0; i--) {
          const p = fireworks[i];
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life * 0.85;
          ctx.fill();
          ctx.restore();
          p.x += p.vx; p.y += p.vy;
          p.vy += 0.09; p.vx *= 0.97; p.vy *= 0.97;
          p.life -= p.decay;
          if (p.life <= 0) fireworks.splice(i, 1);
        }

        if (fw_elapsed > 1000) statusEl.textContent = '✦ Fireworks!';

        // Loop back
        if (fw_elapsed >= FIREWORK_DURATION && fireworks.length === 0) {
          phase = 'spiral';
          startTime = time;
          fireworks = [];
          statusEl.textContent = 'Building spiral...';
        }
      }

      texture.needsUpdate = true;
    };
  }
});
</script>
</body>
</html>
